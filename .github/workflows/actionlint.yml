name: actionlint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'

# reviewdog が PR レビューコメントを投稿するのに必要
# （省略すると 403: "Resource not accessible by integration" になる）
permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-pr-review
          # fail_on_error は非推奨。fail_level=error で error レベル時に CI 失敗させる
          fail_level: error
